<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scolia</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{--bg:#eaf0ee;--card:#fff;--tx:#14261f;--mu:#5d6f68;--bd:#d3deda;--ch:#1f4d3f;--chtx:#f3f7f5;--ac:#f2b705;--ok:#16794f;--ko:#b3361e;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--bg:#0f1815;--card:#17241f;--tx:#e8f0ec;--mu:#97aaa2;--bd:#2a3c35;--ch:#0b2a21;--ok:#4fc58b;--ko:#ff8a73}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 "Bricolage Grotesque",system-ui,sans-serif}
header{background:var(--ch);color:var(--chtx);padding:14px 16px 0}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;padding-bottom:12px}
.logo{font-size:28px;font-weight:800}.logo i{font-style:normal;color:var(--ac)}
.who{font-size:13px;opacity:.85;text-align:right}
.who button{background:none;border:0;color:var(--ac);font:inherit;font-size:13px;cursor:pointer;padding:0}
.nav{display:flex;gap:4px;overflow-x:auto}
.nav button{border:0;background:none;color:var(--chtx);opacity:.7;padding:10px 14px;font:inherit;font-weight:600;border-bottom:4px solid transparent;cursor:pointer;white-space:nowrap}
.nav button.on{opacity:1;border-color:var(--ac)}
main{max-width:980px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px;margin-bottom:12px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:12px}.g .card{margin:0}
.big{display:block;font-size:24px;font-weight:800}.mu{color:var(--mu);font-size:14px}
h3{margin:0 0 10px;font-size:19px}
.w{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:15px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--bd);vertical-align:middle}th{color:var(--mu);font-weight:600;font-size:13px}
label{display:flex;flex-direction:column;font-size:13px;color:var(--mu);gap:3px;margin-bottom:10px}
input,select,textarea{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:6px;padding:9px;max-width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:end}.row label{margin:0}
.b{font:inherit;font-weight:600;background:var(--ch);color:var(--chtx);border:0;border-radius:6px;padding:9px 14px;cursor:pointer}
.bar{height:8px;background:var(--bd);border-radius:4px;overflow:hidden;min-width:90px}.bar span{display:block;height:100%;background:var(--ok)}
.ok{color:var(--ok);font-weight:600}.ko{color:var(--ko);font-weight:600}
:focus-visible{outline:3px solid var(--ac);outline-offset:1px}
@media print{header,.np{display:none!important}body{background:#fff;color:#000}.card{border:0}}
</style></head><body>
<div id="app"></div>
<script>
const U="https://ohofvmjmhvkjhvrnwcds.supabase.co",K="sb_publishable_reB5NVsjUfeTF4sqZ8mBVw_HR9a7pcd";
const db=supabase.createClient(U,K);
const $=s=>document.querySelector(s),esc=t=>String(t??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const F=n=>Number(n).toLocaleString("fr-FR")+" FCFA",dt=d=>String(d).split("-").reverse().join("/");
const RL={admin:"Administrateur",enseignant:"Enseignant",parent:"Parent",eleve:"Élève"};
let ed={},pw=false,P=null,D={cl:[],ma:[],st:[],pa:[],gr:[],ab:[],pr:[],ta:[],an:[]},tab="ac",flash="",sel={c:"",m:"",t:1,b:"",r:"enseignant"};

async function start(){const{data:{session}}=await db.auth.getSession();session?load():login()}
function login(msg){$("#app").innerHTML=`<main><div class="card" style="max-width:380px;margin:40px auto"><div class="logo" style="margin-bottom:12px;color:var(--ch)">Scol<i>ia</i></div><label>E-mail<input id="em" type="email" autocomplete="username" autocapitalize="none"></label><label>Mot de passe<input id="pw" type="password" autocomplete="current-password"></label><button class="b" onclick="signin()">Se connecter</button><p class="ko">${esc(msg)}</p></div></main>`}
async function signin(){const{error}=await db.auth.signInWithPassword({email:$("#em").value.trim(),password:$("#pw").value});error?login("E-mail ou mot de passe incorrect."):load()}
async function out(){await db.auth.signOut();P=null;pw=false;login()}
function shell(h,nav){const s=P.schools?.nom||"";$("#app").innerHTML=`<header><div class="top"><div class="logo">Scol<i>ia</i></div><div class="who">${esc(s)}<br>${esc(P.nom)} · <button onclick="pw=!pw;render()">Mot de passe</button> · <button onclick="out()">Se déconnecter</button></div></div>${nav||""}</header><main>${h}</main>`}
async function load(){
 const{data:{user}}=await db.auth.getUser();
 const{data:p}=await db.from("profiles").select("*, schools(nom)").eq("id",user.id).maybeSingle();
 if(!p){P={nom:"",schools:null,role:""};shell(`<div class="card"><p>Ce compte n’est relié à aucune école. Contactez l’administration.</p></div>`);return}
 P=p;tab=p.role=="enseignant"?"no":"ac";refresh()}
async function refresh(){
 const r=await Promise.all([db.from("classes").select("*").order("nom"),db.from("matieres").select("*").order("nom"),db.from("students").select("*, classes(nom)").order("nom"),db.from("payments").select("*").order("paye_le",{ascending:false}),db.from("grades").select("*"),db.from("absences").select("*"),db.from("profiles").select("*").order("nom"),db.from("teacher_assignments").select("*"),db.from("announcements").select("*").order("cree_le",{ascending:false})]);
 const e=r.find(x=>x.error);if(e)flash="Erreur : "+e.error.message;
 D={cl:r[0].data||[],ma:r[1].data||[],st:r[2].data||[],pa:r[3].data||[],gr:r[4].data||[],ab:r[5].data||[],pr:r[6].data||[],ta:r[7].data||[],an:r[8].data||[]};render()}
const adm=()=>P.role=="admin",fam=()=>P.role=="parent"||P.role=="eleve";
const cls=()=>adm()?D.cl:D.cl.filter(c=>D.ta.some(a=>a.class_id==c.id));
const mats=c=>adm()?D.ma:D.ma.filter(m=>D.ta.some(a=>a.class_id==c&&a.matiere_id==m.id));
const paid=s=>D.pa.filter(x=>x.student_id==s.id).reduce((a,x)=>a+Number(x.montant),0);
const bar=s=>`<div class="bar"><span style="width:${s.frais_total>0?Math.min(100,Math.round(100*paid(s)/s.frais_total)):0}%"></span></div>`;
const opt=(l,cur,f)=>l.map(x=>`<option value="${x.id}"${x.id==cur?" selected":""}>${esc(f(x))}</option>`).join("");
const tri=t=>[1,2,3].map(n=>`<option value="${n}"${n==t?" selected":""}>Trimestre ${n}</option>`).join("");
const gr=(s,m,t)=>D.gr.find(g=>g.student_id==s&&g.matiere_id==m&&g.trimestre==t);
function moy(s,t){let a=0,b=0;D.ma.forEach(m=>{const g=gr(s,m.id,t);if(g&&g.note!=null){a+=Number(g.note)*Number(m.coef);b+=Number(m.coef)}});return b?a/b:null}
function rang(s,t){const st=D.st.find(x=>x.id==s),l=D.st.filter(x=>x.class_id==st.class_id&&moy(x.id,t)!=null).sort((x,y)=>moy(y.id,t)-moy(x.id,t)),k=l.findIndex(x=>x.id==s);return k<0?"—":(k+1)+"/"+l.length}
const mention=m=>m==null?"—":m>=16?"Très bien":m>=14?"Bien":m>=12?"Assez bien":m>=10?"Passable":"Insuffisant";
function sl(k,v){sel[k]=v;render()}
const PWC=`<div class="card np"><h3>Changer mon mot de passe</h3><div class="row"><label>Nouveau mot de passe<input id="p1" type="password" autocomplete="new-password" placeholder="8 caractères minimum"></label><label>Confirmer<input id="p2" type="password" autocomplete="new-password"></label><button class="b" onclick="setPw()">Enregistrer</button></div></div>`;
async function setPw(){
 const a=$("#p1").value,b=$("#p2").value;
 if(a.length<8){flash="Erreur : le mot de passe doit contenir au moins 8 caractères.";return render()}
 if(a!==b){flash="Erreur : les deux mots de passe ne sont pas identiques.";return render()}
 const{error}=await db.auth.updateUser({password:a});
 let m=error?error.message:"";
 if(/different/i.test(m))m="le nouveau mot de passe doit être différent de l’ancien.";
 else if(/weak|short|least/i.test(m))m="mot de passe trop faible, choisissez-en un plus long ou plus varié.";
 flash=error?"Erreur : "+m:"Mot de passe modifié avec succès.";
 if(!error)pw=false;render()}
function bul(sid,t){const s=D.st.find(x=>x.id==sid),m=moy(sid,t);if(!s)return"";
 return `<div class="card"><h3>Bulletin de ${esc(s.nom)} <span class="mu">${esc(s.classes?.nom||"")} · Trimestre ${t}</span></h3><div class="w"><table><tr><th>Matière</th><th>Coef.</th><th>Note /20</th><th>Appréciation</th></tr>${D.ma.map(x=>{const g=gr(sid,x.id,t);return `<tr><td>${esc(x.nom)}</td><td>${x.coef}</td><td>${g?.note??"—"}</td><td>${esc(g?.appreciation||"")}</td></tr>`}).join("")}</table></div><p><b>Moyenne :</b> ${m==null?"—":m.toFixed(2)} /20 &nbsp; ${fam()?"":`<b>Rang :</b> ${rang(sid,t)} &nbsp; `}<b>Absences :</b> ${D.ab.filter(a=>a.student_id==sid).length}</p><p class="mu">Mention : ${mention(m)}</p></div>`}
function frais(s){const r=s.frais_total-paid(s),p=D.pa.filter(x=>x.student_id==s.id);
 return `<div class="card"><h3>Frais de scolarité</h3>${bar(s)}<p>Payé : ${F(paid(s))} sur ${F(s.frais_total)}<br>${r>0?`<span class="ko">Reste à payer : ${F(r)}</span>`:'<span class="ok">Soldé</span>'}</p>${p.length?`<table>${p.map(x=>`<tr><td>${dt(x.paye_le)}</td><td>${F(x.montant)}</td><td>${esc(x.mode||"")}</td></tr>`).join("")}</table>`:""}</div>`}
function famille(){const sid=sel.b||D.st[0]?.id,s=D.st.find(x=>x.id==sid),t=sel.t;
 if(!s)return `<div class="card"><p>Aucun élève n’est encore rattaché à ce compte. Contactez l’administration de l’école.</p></div>`;
 const ab=D.ab.filter(a=>a.student_id==sid).sort((x,y)=>y.jour.localeCompare(x.jour));
 return `${annList(5)}<div class="card np"><div class="row">${D.st.length>1?`<label>Enfant<select onchange="sl('b',this.value)">${opt(D.st,sid,x=>x.nom)}</select></label>`:""}<label>Période<select onchange="sl('t',+this.value)">${tri(t)}</select></label><button class="b" onclick="print()">Imprimer le bulletin</button></div></div>${bul(sid,t)}<div class="card"><h3>Absences</h3>${ab.length?`<table>${ab.map(a=>`<tr><td>${dt(a.jour)}</td><td>${esc(a.motif||"")}</td></tr>`).join("")}</table>`:'<p class="mu">Aucune absence enregistrée.</p>'}</div>${P.role=="parent"?frais(s):""}`}
function render(){
 const A=adm(),T=A?[["ac","Accueil"],["cl","Classes et matières"],["el","Élèves"],["fr","Frais de scolarité"],["no","Notes"],["bu","Bulletins"],["co","Comptes"],["an","Annonces"]]:P.role=="enseignant"?[["no","Notes"],["bu","Bulletins"],["an","Annonces"]]:[];
 const nav=T.length?`<div class="nav">${T.map(([k,t])=>`<button class="${tab==k?"on":""}" onclick="tab='${k}';render()">${t}</button>`).join("")}</div>`:"";
 const tot=D.st.reduce((a,s)=>a+Number(s.frais_total),0),enc=D.pa.reduce((a,x)=>a+Number(x.montant),0);
 let h=flash?`<p class="np ${flash.startsWith("Erreur")?"ko":"ok"}">${esc(flash)}</p>`:"";flash="";
 if(pw)h+=PWC;
 if(fam())h+=famille();
 if(tab=="ac"&&A)h+=`<div class="g"><div class="card"><span class="mu">Élèves inscrits</span><b class="big">${D.st.length}</b></div><div class="card"><span class="mu">Classes</span><b class="big">${D.cl.length}</b></div><div class="card"><span class="mu">Encaissé</span><b class="big">${F(enc)}</b></div><div class="card"><span class="mu">Reste à encaisser</span><b class="big">${F(tot-enc)}</b></div></div><div class="card"><p>Commencez par créer vos <b>classes</b> et vos <b>matières</b>, puis inscrivez vos <b>élèves</b>. Saisissez ensuite les <b>notes</b>, éditez les <b>bulletins</b> et créez les <b>comptes</b> de vos enseignants et des familles.</p></div>`;
 if(tab=="cl"&&A)h+=`<div class="card"><h3>Nouvelle classe</h3><div class="row"><label>Nom<input id="cn" placeholder="6e A"></label><label>Année scolaire<input id="ca" value="2026-2027"></label><button class="b" onclick="addCl()">Ajouter la classe</button></div></div><div class="card w"><table><tr><th>Classe</th><th>Année</th><th></th></tr>${D.cl.map(c=>ed.t=="cl"&&ed.id==c.id?`<tr><td><input id="e1" value="${esc(c.nom)}"></td><td><input id="e2" value="${esc(c.annee)}"></td><td>${EB()}</td></tr>`:`<tr><td>${esc(c.nom)}</td><td>${esc(c.annee)}</td><td>${AB("cl",c.id)}</td></tr>`).join("")||'<tr><td colspan="3" class="mu">Aucune classe pour le moment.</td></tr>'}</table></div><div class="card"><h3>Nouvelle matière</h3><div class="row"><label>Nom<input id="mn" placeholder="Mathématiques"></label><label>Coefficient<input id="mc" type="number" step="0.5" min="0.5" value="1" style="width:90px"></label><button class="b" onclick="addMa()">Ajouter la matière</button></div></div><div class="card w"><table><tr><th>Matière</th><th>Coef.</th><th></th></tr>${D.ma.map(m=>ed.t=="ma"&&ed.id==m.id?`<tr><td><input id="e1" value="${esc(m.nom)}"></td><td><input id="e2" type="number" step="0.5" min="0.5" value="${m.coef}" style="width:80px"></td><td>${EB()}</td></tr>`:`<tr><td>${esc(m.nom)}</td><td>${m.coef}</td><td>${AB("ma",m.id)}</td></tr>`).join("")||'<tr><td colspan="3" class="mu">Aucune matière pour le moment.</td></tr>'}</table></div>`;
 if(tab=="el"&&A)h+=`<div class="card"><h3>Inscrire un élève</h3><div class="row"><label>Nom complet<input id="sn"></label><label>Classe<select id="sc"><option value="">—</option>${D.cl.map(c=>`<option value="${c.id}">${esc(c.nom)}</option>`).join("")}</select></label><label>Frais annuels (FCFA)<input id="sf" type="number" min="0" value="150000" style="width:130px"></label><button class="b" onclick="addSt()">Inscrire</button></div></div><div class="card"><h3>Importer plusieurs élèves</h3><p class="mu">Une ligne par élève : <b>Nom complet ; Classe ; Frais annuels</b> (la classe et les frais sont facultatifs). Collez une liste copiée depuis Excel ou chargez un fichier CSV. Les classes qui n’existent pas encore sont créées automatiquement.</p><textarea id="imp" rows="7" style="width:100%" placeholder="Grâce Ngoma ; 6e A ; 150000&#10;Jordy Mbemba ; 3e B"></textarea><div class="row" style="margin-top:8px"><label>Frais par défaut (FCFA)<input id="impf" type="number" min="0" value="150000" style="width:130px"></label><label>Fichier CSV ou texte<input type="file" accept=".csv,.txt,text/*" onchange="lire(this.files[0])"></label><button class="b" onclick="importSt()">Importer</button></div></div><div class="card w"><table><tr><th>Élève</th><th>Classe</th><th>Frais annuels</th><th></th></tr>${D.st.map(s=>ed.t=="st"&&ed.id==s.id?`<tr><td><input id="e1" value="${esc(s.nom)}"></td><td><select id="e2"><option value="">—</option>${opt(D.cl,s.class_id,x=>x.nom)}</select></td><td><input id="e3" type="number" min="0" value="${s.frais_total}" style="width:110px"></td><td>${EB()}</td></tr>`:`<tr><td>${esc(s.nom)}</td><td>${esc(s.classes?.nom||"—")}</td><td>${F(s.frais_total)}</td><td>${AB("st",s.id)}</td></tr>`).join("")||'<tr><td colspan="4" class="mu">Aucun élève inscrit.</td></tr>'}</table></div>`;
 if(tab=="fr"&&A)h+=`<div class="card w"><table><tr><th>Élève</th><th>Avancement</th><th>Reste</th><th>Encaisser</th></tr>${D.st.map(s=>{const r=s.frais_total-paid(s);return `<tr><td>${esc(s.nom)}</td><td>${bar(s)}</td><td>${r>0?F(r):'<span class="ok">Soldé</span>'}</td><td><div class="row"><input id="p${s.id}" type="number" min="1" placeholder="Montant" style="width:110px"><select id="m${s.id}"><option>Espèces</option><option>MTN Mobile Money</option><option>Airtel Money</option></select><button class="b" onclick="pay('${s.id}')">Valider</button></div></td></tr>`}).join("")||'<tr><td colspan="4" class="mu">Inscrivez d’abord des élèves.</td></tr>'}</table></div>`+HIST();
 if(tab=="no"&&!fam()){const cs=cls(),c=cs.find(x=>x.id==sel.c)?sel.c:cs[0]?.id,ms=mats(c),m=ms.find(x=>x.id==sel.m)?sel.m:ms[0]?.id,t=sel.t;
  h+=cs.length&&ms.length?`${A?"":'<p class="note mu">Vous ne voyez que vos classes et vos matières.</p>'}<div class="card"><div class="row"><label>Classe<select onchange="sl('c',this.value)">${opt(cs,c,x=>x.nom)}</select></label><label>Matière<select onchange="sl('m',this.value)">${opt(ms,m,x=>x.nom)}</select></label><label>Période<select onchange="sl('t',+this.value)">${tri(t)}</select></label></div></div><div class="card w"><table><tr><th>Élève</th><th>Note /20</th><th>Appréciation</th></tr>${D.st.filter(s=>s.class_id==c).map(s=>{const g=gr(s.id,m,t);return `<tr><td>${esc(s.nom)}</td><td><input id="n${s.id}" type="number" min="0" max="20" step="0.25" value="${g?.note??""}" style="width:80px"></td><td><input id="a${s.id}" value="${esc(g?.appreciation||"")}" style="width:100%;min-width:150px"></td></tr>`}).join("")||'<tr><td colspan="3" class="mu">Aucun élève dans cette classe.</td></tr>'}</table><p><button class="b" onclick="saveN('${c}','${m}',${t})">Enregistrer les notes</button></p></div>`:`<div class="card"><p>${A?"Créez d’abord au moins une classe et une matière.":"Aucune classe ne vous est encore attribuée. Contactez l’administration."}</p></div>`}
 if(tab=="bu"&&!fam()){const sid=sel.b||D.st[0]?.id,t=sel.t;
  h+=D.st.length?`<div class="card np"><div class="row"><label>Élève<select onchange="sl('b',this.value)">${opt(D.st,sid,x=>x.nom)}</select></label><label>Période<select onchange="sl('t',+this.value)">${tri(t)}</select></label><button class="b" onclick="print()">Imprimer</button></div></div>${bul(sid,t)}<div class="card np"><h3>Enregistrer une absence</h3><div class="row"><label>Date<input id="ad" type="date" value="${new Date().toISOString().slice(0,10)}"></label><label>Motif (facultatif)<input id="am"></label><button class="b" onclick="addAb('${sid}')">Ajouter</button></div></div>${ABS(sid)}`:`<div class="card"><p>Aucun élève à afficher pour le moment.</p></div>`}
 if(tab=="co"&&A){const r=sel.r;
  h+=`<div class="card"><h3>Nouveau compte</h3><div class="row" style="margin-bottom:12px">${[["enseignant","Enseignant"],["parent","Parent"],["eleve","Élève"]].map(([k,t])=>`<button class="b" style="opacity:${r==k?1:.45}" onclick="sl('r','${k}')">${t}</button>`).join("")}</div><div class="row"><label>Nom complet<input id="kn"></label><label>E-mail<input id="ke" type="email" autocapitalize="none"></label><label>Mot de passe provisoire<input id="kp" placeholder="8 caractères minimum"></label>${r=="enseignant"?`<label>Classe<select id="kc"><option value="">—</option>${opt(D.cl,"",x=>x.nom)}</select></label><label>Matière<select id="km"><option value="">—</option>${opt(D.ma,"",x=>x.nom)}</select></label>`:`<label>${r=="parent"?"Parent de l’élève":"Compte de l’élève"}<select id="ks">${opt(D.st,"",x=>x.nom)}</select></label>`}<button class="b" onclick="createAcc()">Créer le compte</button></div></div><div class="card w"><table><tr><th>Nom</th><th>Rôle</th></tr>${D.pr.map(p=>`<tr><td>${esc(p.nom)}</td><td>${RL[p.role]||p.role}</td></tr>`).join("")}</table></div>`+ass()}
 if(tab=="an"&&!fam())h+=annonces(A);
 shell(h,nav)}
async function ins(t,row){const{error}=await db.from(t).insert(row);flash=error?"Erreur : "+(/duplicate/i.test(error.message)?"cet enregistrement existe déjà.":error.message):"Enregistré.";refresh()}
function addCl(){const n=$("#cn").value.trim();if(!n)return $("#cn").focus();ins("classes",{school_id:P.school_id,nom:n,annee:$("#ca").value.trim()||"2026-2027"})}
function addMa(){const n=$("#mn").value.trim();if(!n)return $("#mn").focus();ins("matieres",{school_id:P.school_id,nom:n,coef:+$("#mc").value||1})}
function addSt(){const n=$("#sn").value.trim();if(!n)return $("#sn").focus();ins("students",{school_id:P.school_id,nom:n,class_id:$("#sc").value||null,frais_total:+$("#sf").value||0})}
function pay(id){const m=+$("#p"+id).value;if(!(m>0))return $("#p"+id).focus();ins("payments",{student_id:id,montant:m,mode:$("#m"+id).value})}
function addAb(id){const d=$("#ad").value;if(!d)return;ins("absences",{student_id:id,jour:d,motif:$("#am").value.trim()||null})}
async function saveN(c,m,t){
 const rows=D.st.filter(s=>s.class_id==c).map(s=>({s,v:$("#n"+s.id).value})).filter(x=>x.v!=="").map(x=>({student_id:x.s.id,matiere_id:m,trimestre:t,note:Math.max(0,Math.min(20,+x.v)),appreciation:$("#a"+x.s.id).value.trim()||null}));
 if(!rows.length){flash="Erreur : aucune note à enregistrer.";return render()}
 const{error}=await db.from("grades").upsert(rows,{onConflict:"student_id,matiere_id,trimestre"});
 flash=error?"Erreur : "+error.message:"Notes enregistrées.";refresh()}
function ass(){const te=D.pr.filter(p=>p.role=="enseignant"),nm=(l,id)=>l.find(x=>x.id==id)?.nom||"?";
 return `<div class="card"><h3>Attributions des enseignants</h3>${te.length&&D.cl.length&&D.ma.length?`<div class="row"><label>Enseignant<select id="at">${opt(te,"",x=>x.nom)}</select></label><label>Classe<select id="ac2">${opt(D.cl,"",x=>x.nom)}</select></label><label>Matière<select id="am2">${opt(D.ma,"",x=>x.nom)}</select></label><button class="b" onclick="addTa()">Attribuer</button></div>`:'<p class="mu">Créez d’abord des enseignants, des classes et des matières.</p>'}</div><div class="card w"><table><tr><th>Enseignant</th><th>Classe</th><th>Matière</th><th></th></tr>${D.ta.map(a=>`<tr><td>${esc(nm(D.pr,a.teacher_id))}</td><td>${esc(nm(D.cl,a.class_id))}</td><td>${esc(nm(D.ma,a.matiere_id))}</td><td><button class="b" onclick="delTa('${a.teacher_id}','${a.class_id}','${a.matiere_id}')">Retirer</button></td></tr>`).join("")||'<tr><td colspan="4" class="mu">Aucune attribution.</td></tr>'}</table></div>`}
function addTa(){ins("teacher_assignments",{teacher_id:$("#at").value,class_id:$("#ac2").value,matiere_id:$("#am2").value})}
async function delTa(t,c,m){const{error}=await db.from("teacher_assignments").delete().eq("teacher_id",t).eq("class_id",c).eq("matiere_id",m);flash=error?"Erreur : "+error.message:"Attribution retirée.";refresh()}
const EB=()=>`<button class="b" onclick="saveEd()">OK</button> <button class="b" style="opacity:.6" onclick="ed={};render()">Annuler</button>`;
const AB=(t,id)=>`<button class="b" onclick="ed={t:'${t}',id:'${id}'};render()">Modifier</button> <button class="b" style="background:var(--ko)" onclick="del('${t}','${id}')">Supprimer</button>`;
const TB={cl:"classes",ma:"matieres",st:"students",pa:"payments",ab:"absences",an:"announcements"};
function HIST(){const nm=id=>D.st.find(x=>x.id==id)?.nom||"?";return `<div class="card w"><h3>Derniers paiements</h3><table>${D.pa.slice(0,15).map(x=>`<tr><td>${dt(x.paye_le)}</td><td>${esc(nm(x.student_id))}</td><td>${F(x.montant)}</td><td>${esc(x.mode||"")}</td><td><button class="b" style="background:var(--ko)" onclick="del('pa','${x.id}')">Annuler</button></td></tr>`).join("")||'<tr><td class="mu">Aucun paiement.</td></tr>'}</table></div>`}
function ABS(sid){const l=D.ab.filter(a=>a.student_id==sid).sort((x,y)=>y.jour.localeCompare(x.jour));return l.length?`<div class="card np w"><h3>Absences enregistrées</h3><table>${l.map(a=>`<tr><td>${dt(a.jour)}</td><td>${esc(a.motif||"")}</td><td><button class="b" style="background:var(--ko)" onclick="del('ab','${a.id}')">Supprimer</button></td></tr>`).join("")}</table></div>`:""}
async function saveEd(){
 const v=i=>$("#e"+i)?.value.trim();const t=ed.t;let row;
 if(!v(1))return $("#e1").focus();
 if(t=="cl")row={nom:v(1),annee:v(2)||"2026-2027"};
 if(t=="ma")row={nom:v(1),coef:+v(2)||1};
 if(t=="st")row={nom:v(1),class_id:$("#e2").value||null,frais_total:+v(3)||0};
 const{error}=await db.from(TB[t]).update(row).eq("id",ed.id);
 flash=error?"Erreur : "+error.message:"Modification enregistrée.";if(!error)ed={};refresh()}
async function del(t,id){
 const q={cl:"Supprimer cette classe ?",ma:"Supprimer cette matière ?",st:"Supprimer cet élève ? Ses notes, absences et paiements seront aussi supprimés.",pa:"Annuler ce paiement ?",ab:"Supprimer cette absence ?",an:"Supprimer cette annonce ?"}[t];
 if(!confirm(q))return;
 const{error}=await db.from(TB[t]).delete().eq("id",id);
 let m=error?error.message:"";
 if(/foreign key|violates/i.test(m))m=t=="cl"?"des élèves sont encore dans cette classe, déplacez-les d’abord.":"cet élément est encore utilisé (des notes existent pour cette matière).";
 flash=error?"Erreur : "+m:"Supprimé.";refresh()}
function lire(f){if(!f)return;const r=new FileReader();r.onload=()=>{$("#imp").value=String(r.result)};r.readAsText(f)}
async function importSt(){
 const df=+$("#impf").value||0,key=x=>String(x).toLowerCase();
 const lines=$("#imp").value.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
 if(lines.length&&/^nom/i.test(lines[0]))lines.shift();
 const rows=lines.map(l=>{const p=l.split(/\t|;|,/).map(x=>x.trim());return{nom:p[0],cl:p[1]||"",frais:p[2]?+p[2].replace(/\s/g,""):df}}).filter(r=>r.nom);
 if(!rows.length){flash="Erreur : aucune ligne à importer.";return render()}
 if(!confirm("Importer "+rows.length+" élève(s) ?"))return;
 const newCl=[...new Set(rows.map(r=>r.cl).filter(c=>c&&!D.cl.some(x=>key(x.nom)==key(c))))];
 let cl=[...D.cl];
 if(newCl.length){const{data,error}=await db.from("classes").insert(newCl.map(n=>({school_id:P.school_id,nom:n,annee:"2026-2027"}))).select();if(error){flash="Erreur : "+error.message;return render()}cl=cl.concat(data)}
 const cid=n=>n?cl.find(x=>key(x.nom)==key(n))?.id||null:null;
 let skip=0;const nv=[];
 rows.forEach(r=>{const c=cid(r.cl);if(D.st.some(s=>key(s.nom)==key(r.nom)&&(s.class_id||null)==c)||nv.some(o=>key(o.nom)==key(r.nom)&&o.class_id==c)){skip++;return}nv.push({school_id:P.school_id,nom:r.nom,class_id:c,frais_total:isNaN(r.frais)?df:r.frais})});
 for(let i=0;i<nv.length;i+=200){const{error}=await db.from("students").insert(nv.slice(i,i+200));if(error){flash="Erreur : "+error.message;return refresh()}}
 flash=nv.length+" élève(s) importé(s)"+(skip?", "+skip+" doublon(s) ignoré(s)":"")+(newCl.length?", "+newCl.length+" classe(s) créée(s)":"")+".";
 refresh()}
function annList(n,canDel){const l=D.an.slice(0,n);return l.length?`<div class="card"><h3>Annonces</h3>${l.map(a=>`<div style="padding:8px 0;border-bottom:1px solid var(--bd)"><b>${esc(a.titre)}</b> <span class="mu">· ${new Date(a.cree_le).toLocaleDateString("fr-FR")}${a.class_id?" · "+esc(D.cl.find(c=>c.id==a.class_id)?.nom||""):" · Toute l’école"}</span><br>${esc(a.contenu).replace(/\n/g,"<br>")}${canDel?`<br><button class="b" style="background:var(--ko);margin-top:6px" onclick="del('an','${a.id}')">Supprimer</button>`:""}</div>`).join("")}</div>`:""}
function annonces(A){return (A?`<div class="card"><h3>Nouvelle annonce</h3><div class="row"><label>Titre<input id="at1" style="min-width:220px"></label><label>Destinataires<select id="at2"><option value="">Toute l’école</option>${opt(D.cl,"",x=>x.nom)}</select></label></div><label style="margin-top:10px">Message<textarea id="at3" rows="4" style="width:100%"></textarea></label><button class="b" onclick="addAn()">Publier</button></div>`:"")+(annList(50,A)||`<div class="card"><p class="mu">Aucune annonce pour le moment.</p></div>`)}
function addAn(){const t=$("#at1").value.trim(),c=$("#at3").value.trim();if(!t||!c){flash="Erreur : renseignez le titre et le message.";return render()}ins("announcements",{school_id:P.school_id,class_id:$("#at2").value||null,titre:t,contenu:c})}
async function createAcc(){
 const r=sel.r,b={role:r,nom:$("#kn").value.trim(),email:$("#ke").value.trim(),password:$("#kp").value};
 if(r=="enseignant"){b.class_id=$("#kc").value||null;b.matiere_id=$("#km").value||null}else b.student_id=$("#ks").value||null;
 if(!b.nom||!b.email||b.password.length<8){flash="Erreur : renseignez le nom, l’e-mail et un mot de passe de 8 caractères minimum.";return render()}
 if(r!="enseignant"&&!b.student_id){flash="Erreur : choisissez un élève.";return render()}
 const{error}=await db.functions.invoke("dynamic-function",{body:b});
 let m=null;
 if(error){try{m=(await error.context.json()).error}catch(e){m=error.message}}
 flash=m?"Erreur : "+m:"Compte créé pour "+b.nom+". Communiquez-lui son e-mail et son mot de passe.";
 refresh()}
start();
</script></body></html>
