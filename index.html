<script>
const U="https://ohofvmjmhvkjhvrnwcds.supabase.co",K="sb_publishable_reB5NVsjUfeTF4sqZ8mBVw_HR9a7pcd";

const F=n=>Number(n).toLocaleString("fr-FR")+" FCFA",dt=d=>String(d).split("-").reverse().join("/");

async function start(){const{data:{session}}=await db.auth.getSession();session?load():login()}
function login(msg){$("#app").innerHTML=`<main><div class="card" style="max-width:380px;margin:40px auto"><div class="logo" style="margin-bottom:12px;color:var(--tx)">Scol<i>ia</i></div><label>E-mail<input id="em" type="email" autocomplete="username" autocapitalize="none"></label><label>Mot de passe<input id="pw" type="password" autocomplete="current-password"></label><button class="b" onclick="signin()">Se connecter</button><p class="ko">${esc(msg)}</p><p><button style="background:none;border:0;color:var(--tx);font:inherit;text-decoration:underline;cursor:pointer;padding:0" onclick="inscr('','ecole')">Inscrire mon école</button><br><button style="background:none;border:0;color:var(--tx);font:inherit;text-decoration:underline;cursor:pointer;padding:0" onclick="inscr('','universite')">Inscrire mon université / institut</button></p></div></main>`}
function inscr(msg,type){$("#app").innerHTML=`<main><div class="card" style="max-width:420px;margin:30px auto"><div class="logo" style="margin-bottom:6px;color:var(--tx)">Scol<i>ia</i></div><h3>Inscrire mon établissement</h3><label>Type d’établissement<select id="it"><option value="ecole"${type!="universite"?" selected":""}>École, collège ou lycée</option><option value="universite"${type=="universite"?" selected":""}>Université ou institut privé</option></select></label><label>Code d’inscription<input id="ic" autocapitalize="characters"></label><label>Nom de l’école<input id="ie"></label><label>Ville<input id="iv"></label><label>Votre nom (responsable)<input id="in"></label><label>E-mail<input id="im" type="email" autocapitalize="none"></label><label>Mot de passe (8 caractères minimum)<input id="ip" type="password" autocomplete="new-password"></label><div class="row"><button class="b" onclick="register()">Créer mon école</button><button class="b" style="opacity:.6" onclick="login()">Retour</button></div><p class="ko">${esc(msg)}</p></div></main>`}
const GR=[["Pilotage",[["ac","🏠","Accueil"]]],["Scolarité",[["cl","🏫","Classes et matières"],["el","🎓","Élèves"],["no","📝","Notes"],["bu","📄","Bulletins"],["moy","📊","Moyennes et résultats"],["calc","🧮","Calculatrice"]]],["Finances",[["fr","💰","Frais de scolarité"],["dep","🧾","Dépenses"],["ab","💳","Abonnement"]]],["Vie scolaire",[["dis","🛡️","Discipline et règlement"],["mat","🧰","Matériel"]]],["Communication",[["an","📢","Annonces"],["msg","💬","Messagerie"]]],["Administration",[["co","👥","Comptes et droits"],["pro","🔑","Propriétaire"]]]];
const LAB={};GR.forEach(g=>g[1].forEach(x=>LAB[x[0]]=x[2]));
const DESC={moy:"Moyennes, rangs et mentions de chaque classe",calc:"Calculer une moyenne avec les coefficients",dep:"Enregistrer les dépenses et suivre le solde",dis:"Règlement intérieur et incidents",mat:"Inventaire et état du matériel",msg:"Consignes à tout le personnel et messages privés",cl:"Créer et gérer les classes et les matières",el:"Inscrire, modifier et importer les élèves",fr:"Suivre les frais et encaisser les paiements",no:"Saisir les notes et les appréciations",bu:"Éditer et imprimer les bulletins",an:"Publier des messages aux familles",co:"Créer les comptes enseignants, parents et élèves",ab:"Votre abonnement, vos paiements et vos reçus",pro:"Écoles clientes, codes d’inscription, paiements"};
let menu=false;
const uni=()=>!!(P&&P.schools&&P.schools.type=="universite");

 if(can("classes"))L.push("cl");if(can("eleves"))L.push("el");if(can("frais")){L.push("fr");L.push("dep")}
 if(can("notes")||P.role=="enseignant")L.push("no");if(can("bulletins")||can("notes")||P.role=="enseignant"){L.push("bu");L.push("moy")}
 if(can("discipline"))L.push("dis");if(can("materiel"))L.push("mat");if(can("comptes"))L.push("co");if(can("abonnement"))L.push("ab");if(P.owner)L.push("pro");return L};
function go(k){tab=k;about=false;pw=false;menu=false;render();window.scrollTo(0,0)}
function shell2(h){const s=P.schools?.nom||"";
 $("#app").innerHTML=`<header><div class="top"><button class="mb np" aria-label="Menu" onclick="menu=!menu;render()">☰</button><div class="logo">Scol<i>ia</i></div><div class="who">${esc(s)}<br>${esc(P.nom)} · ${RL[P.role]||""}</div></div></header>${menu?DRAWER():""}<main>${h}</main>`}

 return `<div class="ov" onclick="menu=false;render()"></div><aside class="dr"><div class="logo" style="padding:6px 8px;color:var(--tx)">Scol<i>ia</i></div>${G}<h4>Compte</h4><button onclick="about=true;pw=false;menu=false;render()"><span class="ic">ℹ️</span>À propos</button><button onclick="pw=true;about=false;menu=false;render()"><span class="ic">⚙️</span>Paramètres</button><button onclick="out()"><span class="ic">🚪</span>Se déconnecter</button></aside>`}
function tiles(){const al=allowed();return `<div class="tiles">${GR.flatMap(g=>g[1]).filter(x=>x[0]!="ac"&&al.includes(x[0])).map(([k,ic,t])=>`<button class="tile" onclick="go('${k}')"><span class="ti">${ic}</span><b>${t}${k=="msg"&&nbMsg()?`<span class="bdg">${nbMsg()}</span>`:""}</b><span class="mu">${DESC[k]}</span></button>`).join("")}</div>`}
function crumb(){if(fam()||about||tab=="ac")return"";return staff()?`<div class="crumb np"><button class="b" style="opacity:.85" onclick="go('ac')">←</button><h3 style="margin:0">${LAB[tab]||""}</h3></div>`:`<div class="crumb np"><h3 style="margin:0">${LAB[tab]||""}</h3></div>`}
const tr=m=>/already been registered/i.test(m)?"Cette adresse e-mail est déjà utilisée.":/password/i.test(m)&&/weak|short|least|characters/i.test(m)?"Mot de passe trop faible ou trop court.":m;
async function fn(b){const{error}=await db.functions.invoke("dynamic-function",{body:b});if(!error)return null;let m;try{m=(await error.context.json()).error}catch(e){m=error.message}return tr(m||"Erreur inconnue.")}
async function register(){
 const b={action:"inscription",type:$("#it").value,code:$("#ic").value.trim(),ecole:$("#ie").value.trim(),ville:$("#iv").value.trim(),nom:$("#in").value.trim(),email:$("#im").value.trim(),password:$("#ip").value};
 if(!b.ecole||!b.nom||!b.email||b.password.length<8)return inscr("Renseignez tous les champs (mot de passe : 8 caractères minimum).",b.type);
 const m=await fn(b);if(m)return inscr(m,b.type);
 const{error}=await db.auth.signInWithPassword({email:b.email,password:b.password});
 error?login("École créée. Connectez-vous avec votre e-mail."):load()}
async function delAcc(id){if(!confirm("Supprimer ce compte ? La personne ne pourra plus se connecter."))return;const m=await fn({action:"supprimer",user_id:id});flash=m?"Erreur : "+m:"Compte supprimé.";refresh()}
async function signin(){const{error}=await db.auth.signInWithPassword({email:$("#em").value.trim(),password:$("#pw").value});error?login("E-mail ou mot de passe incorrect."):load()}
async function out(){await db.auth.signOut();P=null;pw=false;about=false;login()}
function shell(h,nav){shell2(h);return;const s=P.schools?.nom||"";$("#app").innerHTML=`<header><div class="top"><div class="logo">Scol<i>ia</i></div><div class="who">${esc(s)}<br>${esc(P.nom)} · <button onclick="about=!about;render()">À propos</button> · <button onclick="pw=!pw;render()">Paramètres</button> · <button onclick="out()">Se déconnecter</button></div></div>${nav||""}</header><main>${h}</main>`}
async function load(){
 const{data:{user}}=await db.auth.getUser();
 const{data:p}=await db.from("profiles").select("*, schools(nom,essai_fin,paye_jusqu_au,suspendu,type)").eq("id",user.id).maybeSingle();
 if(!p){P={nom:"",schools:null,role:""};shell(`<div class="card"><p>Ce compte n’est relié à aucune école. Contactez l’administration.</p></div>`);return}
 P=p;tab="ac";const{data:ow}=await db.from("owners").select("user_id").maybeSingle();P.owner=!!ow;refresh()}
async function refresh(){
 const r=await Promise.all([db.from("classes").select("*").order("nom"),db.from("matieres").select("*").order("nom"),db.from("students").select("*, classes(nom)").order("nom"),db.from("payments").select("*").order("paye_le",{ascending:false}),db.from("grades").select("*"),db.from("absences").select("*"),db.from("profiles").select("*").order("nom"),db.from("teacher_assignments").select("*"),db.from("announcements").select("*").order("cree_le",{ascending:false}),db.from("subscription_payments").select("*").order("cree_le",{ascending:false}),db.from("schools").select("nom,essai_fin,paye_jusqu_au,suspendu,type").maybeSingle(),db.from("messages").select("*").order("cree_le",{ascending:true}),db.from("incidents").select("*").order("jour",{ascending:false}),db.from("materiel").select("*").order("nom"),db.from("depenses").select("*").order("jour",{ascending:false}),db.from("reglement").select("*").maybeSingle()]);
 const e=r.find(x=>x.error);if(e)flash="Erreur : "+e.error.message;
 D={cl:r[0].data||[],ma:r[1].data||[],st:r[2].data||[],pa:r[3].data||[],gr:r[4].data||[],ab:r[5].data||[],pr:r[6].data||[],ta:r[7].data||[],an:r[8].data||[],sp:r[9].data||[],ms:r[11].data||[],inc:r[12].data||[],mt:r[13].data||[],dp:r[14].data||[],rg:(r[15]&&r[15].data)||null};if(r[10]&&r[10].data)P.schools=r[10].data;render()}
const adm=()=>P.role=="admin",fam=()=>P.role=="parent"||P.role=="eleve";
const PERMS=[["eleves","Élèves et inscriptions"],["classes","Classes et matières"],["notes","Saisie des notes"],["bulletins","Bulletins et moyennes"],["frais","Frais, paiements et dépenses"],["abonnement","Abonnement de l’établissement"],["annonces","Publier des annonces"],["comptes","Créer et supprimer des comptes"],["discipline","Discipline et règlement intérieur"],["materiel","Matériel de l’établissement"],["diffusion","Envoyer des consignes à tout le personnel"]];
const can=p=>!!P&&(P.role=="admin"||(P.permissions||[]).includes(p));
const staff=()=>!!P&&["admin","secretaire","gestionnaire","surveillant","enseignant"].includes(P.role);
const full=()=>can("notes")||can("bulletins");
const nbMsg=()=>D.ms.filter(m=>m.destinataire==P.id&&!m.lu).length;
const cls=()=>full()?D.cl:D.cl.filter(c=>D.ta.some(a=>a.class_id==c.id));
const mats=c=>full()?D.ma:D.ma.filter(m=>D.ta.some(a=>a.class_id==c&&a.matiere_id==m.id));

const bar=s=>`<div class="bar"><span style="width:${s.frais_total>0?Math.min(100,Math.round(100*paid(s)/s.frais_total)):0}%"></span></div>`;
const opt=(l,cur,f)=>l.map(x=>`<option value="${x.id}"${x.id==cur?" selected":""}>${esc(f(x))}</option>`).join("");
const tri=t=>(uni()?[1,2]:[1,2,3]).map(n=>`<option value="${n}"${n==t?" selected":""}>Trimestre ${n}</option>`).join("");
const gr=(s,m,t)=>D.gr.find(g=>g.student_id==s&&g.matiere_id==m&&g.trimestre==t);
function moy(s,t){let a=0,b=0;D.ma.forEach(m=>{const g=gr(s,m.id,t);if(g&&g.note!=null){a+=Number(g.note)*Number(m.coef);b+=Number(m.coef)}});return b?a/b:null}
function rang(s,t){const st=D.st.find(x=>x.id==s),l=D.st.filter(x=>x.class_id==st.class_id&&moy(x.id,t)!=null).sort((x,y)=>moy(y.id,t)-moy(x.id,t)),k=l.findIndex(x=>x.id==s);return k<0?"—":(k+1)+"/"+l.length}

function sl(k,v){sel[k]=v;render()}
const PWC=`<div class="card np"><h3>Changer mon mot de passe</h3><div class="row"><label>Nouveau mot de passe<input id="p1" type="password" autocomplete="new-password" placeholder="8 caractères minimum"></label><label>Confirmer<input id="p2" type="password" autocomplete="new-password"></label><button class="b" onclick="setPw()">Enregistrer</button></div></div>`;
async function setPw(){
 const a=$("#p1").value,b=$("#p2").value;
 if(a.length<8){flash="Erreur : le mot de passe doit contenir au moins 8 caractères.";return render()}
 if(a!==b){flash="Erreur : les deux mots de passe ne sont pas identiques.";return render()}
 const{error}=await db.auth.updateUser({password:a});
 let m=error?error.message:"";
 if(/different/i.test(m))m="le nouveau mot de passe doit être différent de l’ancien.";
 else if(/weak|short|least/i.test(m))m="mot de passe trop faible, choisissez-en un plus long ou plus varié.";
 flash=error?"Erreur : "+m:"Mot de passe modifié avec succès.";
 if(!error)pw=false;render()}
function bul(sid,t){const s=D.st.find(x=>x.id==sid),m=moy(sid,t);if(!s)return"";
 return `<div class="card"><h3>Bulletin de ${esc(s.nom)} <span class="mu">${esc(s.classes?.nom||"")} · Trimestre ${t}</span></h3><div class="w"><table><tr><th>Matière</th><th>Coef.</th><th>Note /20</th><th>Appréciation</th></tr>${D.ma.map(x=>{const g=gr(sid,x.id,t);return `<tr><td>${esc(x.nom)}</td><td>${x.coef}</td><td>${g?.note??"—"}</td><td>${esc(g?.appreciation||"")}</td></tr>`}).join("")}</table></div><p><b>Moyenne :</b> ${m==null?"—":m.toFixed(2)} /20 &nbsp; <b>Rang :</b> ${fam()?rgf(sid,t):rang(sid,t)} &nbsp; <b>Absences :</b> ${D.ab.filter(a=>a.student_id==sid).length}</p><p class="mu">Mention : ${mention(m)}</p></div>`}

 return `<div class="card"><h3>Frais de scolarité</h3>${bar(s)}<p>Payé : ${F(paid(s))} sur ${F(s.frais_total)}<br>${r>0?`<span class="ko">Reste à payer : ${F(r)}</span>`:'<span class="ok">Soldé</span>'}</p>${p.length?`<table>${p.map(x=>`<tr><td>${dt(x.paye_le)}</td><td>${F(x.montant)}</td><td>${esc(x.mode||"")}</td></tr>`).join("")}</table>`:""}</div>`}
function famille(){const sid=sel.b||D.st[0]?.id,s=D.st.find(x=>x.id==sid),t=sel.t;

 if(!rows.length){flash="Erreur : aucune note à enregistrer.";return render()}

async function saveEd(){

async function del(t,id){
 const q={cl:"Supprimer cette classe ?",ma:"Supprimer cette matière ?",st:"Supprimer cet élève ? Ses notes, absences et paiements seront aussi supprimés.",pa:"Annuler ce paiement ?",ab:"Supprimer cette absence ?",an:"Supprimer cette annonce ?",in:"Supprimer cet incident ?",mt:"Supprimer cet équipement ?",dp:"Supprimer cette dépense ?"}[t];
 if(!confirm(q))return;
 const{error}=await db.from(TB[t]).delete().eq("id",id);
 let m=error?error.message:"";
 if(/row-level security/i.test(m))m="action refusée (abonnement expiré ou droits insuffisants).";else if(/foreign key|violates/i.test(m))m=t=="cl"?"des élèves sont encore dans cette classe, déplacez-les d’abord.":"cet élément est encore utilisé (des notes existent pour cette matière).";
 flash=error?"Erreur : "+m:"Supprimé.";refresh()}

async function importSt(){
 const df=+$("#impf").value||0,key=x=>String(x).toLowerCase();
 const lines=$("#imp").value.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
 if(lines.length&&/^nom/i.test(lines[0]))lines.shift();
 const rows=lines.map(l=>{const p=l.split(/\t|;|,/).map(x=>x.trim());return{nom:p[0],cl:p[1]||"",frais:p[2]?+p[2].replace(/\s/g,""):df}}).filter(r=>r.nom);
 if(!rows.length){flash="Erreur : aucune ligne à importer.";return render()}
 if(!confirm("Importer "+rows.length+" élève(s) ?"))return;
 const newCl=[...new Set(rows.map(r=>r.cl).filter(c=>c&&!D.cl.some(x=>key(x.nom)==key(c))))];
 let cl=[...D.cl];
 if(newCl.length){const{data,error}=await db.from("classes").insert(newCl.map(n=>({school_id:P.school_id,nom:n,annee:"2026-2027"}))).select();if(error){flash="Erreur : "+error.message;return render()}cl=cl.concat(data)}
 const cid=n=>n?cl.find(x=>key(x.nom)==key(n))?.id||null:null;
 let skip=0;const nv=[];
 rows.forEach(r=>{const c=cid(r.cl);if(D.st.some(s=>key(s.nom)==key(r.nom)&&(s.class_id||null)==c)||nv.some(o=>key(o.nom)==key(r.nom)&&o.class_id==c)){skip++;return}nv.push({school_id:P.school_id,nom:r.nom,class_id:c,frais_total:isNaN(r.frais)?df:r.frais})});
 for(let i=0;i<nv.length;i+=200){const{error}=await db.from("students").insert(nv.slice(i,i+200));if(error){flash="Erreur : "+error.message;return refresh()}}
 flash=nv.length+" élève(s) importé(s)"+(skip?", "+skip+" doublon(s) ignoré(s)":"")+(newCl.length?", "+newCl.length+" classe(s) créée(s)":"")+".";
 refresh()}
