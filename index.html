<style>
:root{--bg:#eaf0ee;--card:#fff;--tx:#14261f;--mu:#5d6f68;--bd:#d3deda;--ch:#1f4d3f;--chtx:#f3f7f5;--ac:#f2b705;--ok:#16794f;--ko:#b3361e;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1815;--card:#17241f;--tx:#e8f0ec;--mu:#97aaa2;--bd:#2a3c35;--ch:#0b2a21;--ok:#4fc58b;--ko:#ff8a73}}
:root[data-theme="light"]{color-scheme:light}
:root[data-theme="dark"]{--bg:#0f1815;--card:#17241f;--tx:#e8f0ec;--mu:#97aaa2;--bd:#2a3c35;--ch:#0b2a21;--ok:#4fc58b;--ko:#ff8a73;color-scheme:dark}
*{box-sizing:border-box}
.mb{background:rgba(255,255,255,.14);border:0;color:var(--chtx);width:44px;height:44px;border-radius:12px;font-size:22px;cursor:pointer}
header{box-shadow:0 2px 10px rgba(0,0,0,.18)}
.top{gap:12px;padding-bottom:14px}.who{flex:1;line-height:1.3}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20}
.dr{position:fixed;top:0;left:0;bottom:0;width:min(310px,86vw);background:var(--card);z-index:21;overflow-y:auto;padding:14px;box-shadow:6px 0 28px rgba(0,0,0,.35)}
.dr h4{margin:18px 8px 6px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mu)}
.dr button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;background:none;color:var(--tx);font:inherit;padding:10px;border-radius:12px;cursor:pointer}
.dr button.on{background:var(--bg);font-weight:600}
.dr .ic,.tile .ti{display:grid;place-items:center;border-radius:12px;background:var(--bg)}
.dr .ic{width:36px;height:36px;font-size:18px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.tile{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--card);border:1px solid var(--bd);border-left:5px solid var(--ac);border-radius:14px;padding:16px;cursor:pointer;font:inherit;color:var(--tx);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.tile:active{transform:scale(.98)}
.tile .ti{width:46px;height:46px;font-size:24px;margin-bottom:4px}
.tile b{font-size:17px}
.bdg{background:var(--ko);color:#fff;border-radius:10px;padding:0 8px;font-size:12px;margin-left:8px}
.crumb{display:flex;align-items:center;gap:12px;margin:0 0 14px}
.card{border-radius:14px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.g .card{border-top:4px solid var(--ac)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 "Bricolage Grotesque",system-ui,sans-serif}
header{background:var(--ch);color:var(--chtx);padding:14px 16px 0}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;padding-bottom:12px}
.logo{font-size:28px;font-weight:800}.logo i{font-style:normal;color:var(--ac)}
.who{font-size:13px;opacity:.85;text-align:right}
.who button{background:none;border:0;color:var(--ac);font:inherit;font-size:13px;cursor:pointer;padding:0}
.nav{display:flex;gap:4px;overflow-x:auto}
.nav button{border:0;background:none;color:var(--chtx);opacity:.7;padding:10px 14px;font:inherit;font-weight:600;border-bottom:4px solid transparent;cursor:pointer;white-space:nowrap}
.nav button.on{opacity:1;border-color:var(--ac)}
main{max-width:980px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px;margin-bottom:12px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:12px}.g .card{margin:0}
.big{display:block;font-size:24px;font-weight:800}.mu{color:var(--mu);font-size:14px}
h3{margin:0 0 10px;font-size:19px}
.w{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:15px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--bd);vertical-align:middle}th{color:var(--mu);font-weight:600;font-size:13px}
label{display:flex;flex-direction:column;font-size:13px;color:var(--mu);gap:3px;margin-bottom:10px}
input,select,textarea{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:6px;padding:9px;max-width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:end}.row label{margin:0}
.b{font:inherit;font-weight:600;background:var(--ch);color:var(--chtx);border:0;border-radius:6px;padding:9px 14px;cursor:pointer}
.bar{height:8px;background:var(--bd);border-radius:4px;overflow:hidden;min-width:90px}.bar span{display:block;height:100%;background:var(--ok)}
.ok{color:var(--ok);font-weight:600}.ko{color:var(--ko);font-weight:600}
:focus-visible{outline:3px solid var(--ac);outline-offset:1px}
@media print{header,.np,.ov,.dr{display:none!important}body{background:#fff;color:#000}.card{border:0}}
</style></head><body>

function addSt(){const n=$("#sn").value.trim();if(!n)return $("#sn").focus();ins("students",{school_id:P.school_id,nom:n,class_id:$("#sc").value||null,frais_total:+$("#sf").value||0})}
function pay(id){const m=+$("#p"+id).value;if(!(m>0))return $("#p"+id).focus();ins("payments",{student_id:id,montant:m,mode:$("#m"+id).value})}

async function saveN(c,m,t){
 const rows=D.st.filter(s=>s.class_id==c).map(s=>({s,v:$("#n"+s.id).value})).filter(x=>x.v!=="").map(x=>({student_id:x.s.id,matiere_id:m,trimestre:t,note:Math.max(0,Math.min(20,+x.v)),appreciation:$("#a"+x.s.id).value.trim()||null}));
 if(!rows.length){flash="Erreur : aucune note à enregistrer.";return render()}
 const{error}=await db.from("grades").upsert(rows,{onConflict:"student_id,matiere_id,trimestre"});
 flash=error?"Erreur : "+friendly(error.message):"Notes enregistrées.";refresh()}

async function saveEd(){
 const v=i=>$("#e"+i)?.value.trim();const t=ed.t;let row;
 if(!v(1))return $("#e1").focus();
 if(t=="cl")row={nom:v(1),annee:v(2)||"2026-2027"};
 if(t=="ma")row={nom:v(1),coef:+v(2)||1};
 if(t=="st")row={nom:v(1),class_id:$("#e2").value||null,frais_total:+v(3)||0};
 const{error}=await db.from(TB[t]).update(row).eq("id",ed.id);
 flash=error?"Erreur : "+friendly(error.message):"Modification enregistrée.";if(!error)ed={};refresh()}
async function del(t,id){
 const q={cl:"Supprimer cette classe ?",ma:"Supprimer cette matière ?",st:"Supprimer cet élève ? Ses notes, absences et paiements seront aussi supprimés.",pa:"Annuler ce paiement ?",ab:"Supprimer cette absence ?",an:"Supprimer cette annonce ?",in:"Supprimer cet incident ?",mt:"Supprimer cet équipement ?",dp:"Supprimer cette dépense ?",ag:"Supprimer cet élément de l’agenda ?",cr:"Supprimer ce créneau ?"}[t];
 if(!confirm(q))return;
 const{error}=await db.from(TB[t]).delete().eq("id",id);
 let m=error?error.message:"";
 if(/row-level security/i.test(m))m="action refusée (abonnement expiré ou droits insuffisants).";else if(/foreign key|violates/i.test(m))m=t=="cl"?"des élèves sont encore dans cette classe, déplacez-les d’abord.":"cet élément est encore utilisé (des notes existent pour cette matière).";
 flash=error?"Erreur : "+m:"Supprimé.";refresh()}
function lire(f){if(!f)return;const r=new FileReader();r.onload=()=>{$("#imp").value=String(r.result)};r.readAsText(f)}
async function importSt(){
 const df=+$("#impf").value||0,key=x=>String(x).toLowerCase();
 const lines=$("#imp").value.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
 if(lines.length&&/^nom/i.test(lines[0]))lines.shift();
 const rows=lines.map(l=>{const p=l.split(/\t|;|,/).map(x=>x.trim());return{nom:p[0],cl:p[1]||"",frais:p[2]?+p[2].replace(/\s/g,""):df}}).filter(r=>r.nom);
 if(!rows.length){flash="Erreur : aucune ligne à importer.";return render()}
 if(!confirm("Importer "+rows.length+" élève(s) ?"))return;
 const newCl=[...new Set(rows.map(r=>r.cl).filter(c=>c&&!D.cl.some(x=>key(x.nom)==key(c))))];
 let cl=[...D.cl];
 if(newCl.length){const{data,error}=await db.from("classes").insert(newCl.map(n=>({school_id:P.school_id,nom:n,annee:"2026-2027"}))).select();if(error){flash="Erreur : "+error.message;return render()}cl=cl.concat(data)}
 const cid=n=>n?cl.find(x=>key(x.nom)==key(n))?.id||null:null;
 let skip=0;const nv=[];
 rows.forEach(r=>{const c=cid(r.cl);if(D.st.some(s=>key(s.nom)==key(r.nom)&&(s.class_id||null)==c)||nv.some(o=>key(o.nom)==key(r.nom)&&o.class_id==c)){skip++;return}nv.push({school_id:P.school_id,nom:r.nom,class_id:c,frais_total:isNaN(r.frais)?df:r.frais})});
 for(let i=0;i<nv.length;i+=200){const{error}=await db.from("students").insert(nv.slice(i,i+200));if(error){flash="Erreur : "+error.message;return refresh()}}
 flash=nv.length+" élève(s) importé(s)"+(skip?", "+skip+" doublon(s) ignoré(s)":"")+(newCl.length?", "+newCl.length+" classe(s) créée(s)":"")+".";
 refresh()}

const friendly=m=>/duplicate/i.test(m)?"cet enregistrement existe déjà.":/row-level security/i.test(m)?"action refusée (abonnement expiré ou droits insuffisants).":m;
const today=()=>new Date().toISOString().slice(0,10);
const finAbo=s=>[s.essai_fin,s.paye_jusqu_au].filter(Boolean).sort().pop()||"";
function abo(){const s=P.schools;if(!s)return"";const f=finAbo(s);
 if(s.suspendu)return `<p class="np ko">Cet abonnement est suspendu : l’application est en lecture seule. Contactez Scolia.</p>`;
 if(!f)return"";const j=Math.ceil((new Date(f+"T23:59:59")-new Date())/864e5);
 if(j<0)return `<p class="np ko">Abonnement expiré le ${dt(f)} : l’application est en lecture seule. Contactez Scolia pour le renouveler.</p>`;
 if(j<=15)return `<p class="np ko">Votre abonnement se termine le ${dt(f)} (${j} jour${j>1?"s":""}). Contactez Scolia pour le renouveler.</p>`;
 return""}
function aboTxt(s){const f=finAbo(s);if(s.bloque)return `<span class="ko">Désactivé</span>`;if(s.suspendu)return `<span class="ko">Suspendu</span>`;if(!f)return `<span class="mu">Sans date</span>`;
 return f<today()?`<span class="ko">Expiré le ${dt(f)}</span>`:`<span class="ok">Actif jusqu’au ${dt(f)}</span>${s.paye_jusqu_au&&s.paye_jusqu_au>=f?"":` <span class="mu">(essai)</span>`}`}

 return (post?`<div class="card np"><h3>Publier dans l’agenda</h3><div class="row"><label>Type<select id="g_t">${tp.map(k=>`<option value="${k}">${AGT[k][0]} ${AGT[k][1]}</option>`).join("")}</select></label><label>Classe<select id="g_c">${ed?'<option value="">Toute l’école</option>':""}${opt(cs,"",x=>x.nom)}</select></label><label>Date<input id="g_d" type="date" value="${today()}"></label><label>Heure (facultatif)<input id="g_h" type="time"></label><label>Matière (facultatif)<select id="g_m"><option value="">—</option>${opt(D.ma,"",x=>x.nom)}</select></label></div><label style="margin-top:10px">Titre<input id="g_x" placeholder="ex. Exercices page 45, Devoir de maths"></label><label>Détails (facultatif)<textarea id="g_e" rows="3" style="width:100%"></textarea></label><button class="b" onclick="addAg()">Publier</button></div>`:"")+`<div class="card"><h3>À venir</h3>${up.length?up.map(a=>agItem(a,dl(a))).join(""):'<p class="mu">Rien de prévu pour le moment.</p>'}</div>`+(pa.length?`<div class="card"><h3>Passé récemment</h3>${pa.map(a=>agItem(a,dl(a))).join("")}</div>`:"")}
function addAg(){const t=$("#g_x").value.trim(),d=$("#g_d").value;if(!t||!d){flash="Erreur : indiquez un titre et une date.";return render()}
 const c=$("#g_c").value||null;if(!c&&!can("agenda")){flash="Erreur : choisissez une classe.";return render()}
 ins("agenda",{school_id:P.school_id,class_id:c,type:$("#g_t").value,titre:t,description:$("#g_e").value.trim()||null,matiere_id:$("#g_m").value||null,jour:d,heure:$("#g_h").value||null})}

function codeCard(){const c=P.schools?.join_code;return c?`<div class="card np"><h3>Code de l’établissement</h3><p style="font-size:26px;letter-spacing:3px;font-weight:800;margin:4px 0">${esc(c)}</p><p class="mu">Donnez ce code aux enseignants, parents, élèves et étudiants : ils créent eux-mêmes leur compte avec leur adresse e-mail (confirmée par un message), puis vous validez leur demande ci-dessous.</p></div>`:""}
function demCard(){const isA=P.role=="admin",RO=[["parent","Parent"],["eleve","Élève / étudiant"],["enseignant","Enseignant"]].concat(isA?[["secretaire","Secrétaire"],["gestionnaire","Gestionnaire"],["surveillant","Surveillant"]]:[]),dflt=r=>r=="personnel"?(isA?"secretaire":"enseignant"):r,RD={parent:"Parent",enseignant:"Enseignant",eleve:"Élève / étudiant",personnel:"Personnel"};
 return `<div class="card"><h3>Demandes d’inscription ${D.dm.length?`<span class="bdg">${D.dm.length}</span>`:""}</h3>${D.dm.length?D.dm.map(d=>`<div style="padding:12px 0;border-bottom:1px solid var(--bd)"><b>${esc(d.nom)}</b> <span class="mu">${esc(d.email)}</span><br><span class="mu">Demande : ${esc(RD[d.role_demande]||d.role_demande)}${d.details?" · "+esc(d.details):""}</span><div class="row" style="margin-top:8px"><label>Rôle<select id="dr_${d.user_id}">${RO.map(([k,t])=>`<option value="${k}"${dflt(d.role_demande)==k?" selected":""}>${t}</option>`).join("")}</select></label><label>Élève rattaché<select id="ds_${d.user_id}"><option value="">—</option>${opt(D.st,"",x=>x.nom)}</select></label><label>Classe<select id="dc_${d.user_id}"><option value="">—</option>${opt(D.cl,"",x=>x.nom)}</select></label><label>Matière<select id="dm_${d.user_id}"><option value="">—</option>${opt(D.ma,"",x=>x.nom)}</select></label></div><p class="mu" style="margin:6px 0 0">Parent ou élève : choisissez l’élève. Enseignant : choisissez la classe et la matière.</p><p style="margin:8px 0 0"><button class="b" onclick="appr('${d.user_id}')">Approuver</button> <button class="b" style="background:var(--ko)" onclick="refu('${d.user_id}')">Refuser</button></p></div>`).join(""):'<p class="mu">Aucune demande en attente.</p>'}</div>`}
async function appr(u){const g=i=>$("#"+i+"_"+u).value||null;const{error}=await db.rpc("approuver_inscription",{p_user:u,p_role:g("dr"),p_student:g("ds"),p_class:g("dc"),p_matiere:g("dm")});flash=error?"Erreur : "+error.message:"Compte approuvé : la personne peut maintenant se connecter.";refresh()}
async function refu(u){if(!confirm("Refuser cette demande ?"))return;const{error}=await db.rpc("refuser_inscription",{p_user:u});flash=error?"Erreur : "+error.message:"Demande refusée.";refresh()}
let REC0=/type=recovery/.test(location.hash);
const LOGO=LOGOB;
function compte(msg,ok){$("#app").innerHTML=`<main><div class="card" style="max-width:420px;margin:30px auto">${LOGO}<h3>Créer mon compte</h3>${ok?`<p class="ok">${esc(ok)}</p><p><button class="b" onclick="login()">Retour à la connexion</button></p>`:`<p class="mu">Pour les parents, enseignants, élèves et étudiants. Vous recevrez un e-mail de confirmation : appuyez sur son lien pour activer votre compte.</p><label>Votre adresse e-mail<input id="cm" type="email" autocapitalize="none" autocomplete="username"></label><label>Mot de passe (8 caractères minimum)<input id="cp" type="password" autocomplete="new-password"></label><label>Confirmer le mot de passe<input id="cq" type="password" autocomplete="new-password"></label><div class="row"><button class="b" onclick="mkAccount()">Créer mon compte</button><button class="b" style="opacity:.6" onclick="login()">Retour</button></div><p class="ko">${esc(msg)}</p>`}</div></main>`}
async function mkAccount(){const e=$("#cm").value.trim(),p=$("#cp").value;
 if(!e||p.length<8)return compte("Indiquez votre e-mail et un mot de passe de 8 caractères minimum.");
 if(p!==$("#cq").value)return compte("Les deux mots de passe ne sont pas identiques.");
 const{error}=await db.auth.signUp({email:e,password:p,options:{emailRedirectTo:location.origin+location.pathname}});
 if(error)return compte(tr(error.message));
 compte("","Un e-mail de confirmation vient de vous être envoyé. Ouvrez-le et appuyez sur le lien pour activer votre compte, puis revenez vous connecter. Pensez à vérifier vos courriers indésirables.")}
function oubli(msg,ok){$("#app").innerHTML=`<main><div class="card" style="max-width:420px;margin:30px auto">${LOGO}<h3>Mot de passe oublié</h3>${ok?`<p class="ok">${esc(ok)}</p><p><button class="b" onclick="login()">Retour</button></p>`:`<label>Votre adresse e-mail<input id="fm" type="email" autocapitalize="none"></label><div class="row"><button class="b" onclick="sendReset()">Envoyer le lien</button><button class="b" style="opacity:.6" onclick="login()">Retour</button></div><p class="ko">${esc(msg)}</p>`}</div></main>`}
async function sendReset(){const e=$("#fm").value.trim();if(!e)return oubli("Indiquez votre adresse e-mail.");
 const{error}=await db.auth.resetPasswordForEmail(e,{redirectTo:location.origin+location.pathname});
 if(error)return oubli(tr(error.message));oubli("","Si cette adresse correspond à un compte, un e-mail de réinitialisation vient d’être envoyé.")}
function resetScreen(msg){$("#app").innerHTML=`<main><div class="card" style="max-width:420px;margin:30px auto">${LOGO}<h3>Nouveau mot de passe</h3><label>Nouveau mot de passe (8 caractères minimum)<input id="rn" type="password" autocomplete="new-password"></label><label>Confirmer<input id="rc" type="password" autocomplete="new-password"></label><button class="b" onclick="saveReset()">Enregistrer</button><p class="ko">${esc(msg)}</p></div></main>`}
async function saveReset(){const a=$("#rn").value;if(a.length<8)return resetScreen("8 caractères minimum.");if(a!==$("#rc").value)return resetScreen("Les deux mots de passe ne sont pas identiques.");
 const{error}=await db.auth.updateUser({password:a});if(error)return resetScreen(tr(error.message));REC0=false;history.replaceState(null,"",location.pathname);load()}
function blockedScreen(){$("#app").innerHTML=`<main><div class="card" style="max-width:440px;margin:30px auto">${LOGO}<h3>Accès désactivé</h3><p>L’accès de votre établissement à Scolia est actuellement désactivé. Contactez la direction de votre établissement ou Scolia.</p><p><button class="b" onclick="out()">Se déconnecter</button></p></div></main>`}
async function joinScreen(){const{data:u}=await db.auth.getUser(),{data:ins}=await db.from("inscriptions").select("*").maybeSingle();
 const bar=`<p style="margin-top:14px"><button class="b" style="opacity:.75" onclick="load()">Actualiser</button> <button class="b" style="opacity:.75" onclick="out()">Se déconnecter</button></p><p class="mu" style="font-size:13px">Connecté : ${esc(u?.user?.email||"")}</p>`;
 let body;
 if(ins&&ins.statut=="en_attente")body=`<h3>Demande envoyée</h3><p>Votre demande pour rejoindre <b>${esc(ins.ecole_nom)}</b> est en attente de validation par la direction. Vous pourrez accéder à l’application dès qu’elle sera approuvée.</p>`;
 else{const ref=ins&&ins.statut=="refuse";
  body=`<h3>${ref?"Demande refusée":"Rejoindre mon établissement"}</h3>${ref?'<p class="ko">Votre précédente demande a été refusée par l’établissement. Vous pouvez en envoyer une nouvelle.</p>':'<p class="mu">Votre adresse e-mail est confirmée. Il reste à indiquer votre établissement : demandez son code à la direction.</p>'}<label>Code de l’établissement<input id="jc" autocapitalize="characters"></label><label>Vous êtes<select id="jr"><option value="parent">Parent</option><option value="enseignant">Enseignant</option><option value="eleve">Élève ou étudiant</option><option value="personnel">Personnel de l’établissement</option></select></label><label>Nom complet<input id="jn" value="${esc(ins?.nom||"")}"></label><label>Précisions pour la direction<input id="jd" placeholder="Parent : nom de l’enfant et classe · Enseignant : matières · Élève : classe"></label><button class="b" onclick="sendJoin()">Envoyer ma demande</button><p id="jm" class="ko"></p>`}
 $("#app").innerHTML=`<main><div class="card" style="max-width:440px;margin:30px auto">${LOGO}${body}${bar}</div></main>`}
async function sendJoin(){const nom=$("#jn").value.trim(),code=$("#jc").value.trim();
 if(!code||nom.length<3){$("#jm").textContent="Renseignez le code de l’établissement et votre nom complet.";return}
 const{error}=await db.rpc("demander_inscription",{p_code:code,p_role:$("#jr").value,p_nom:nom,p_details:$("#jd").value.trim()});
 if(error){$("#jm").textContent=error.message;return}joinScreen()}

 const r=sel.r,b={role:r,nom:$("#kn").value.trim(),email:$("#ke").value.trim(),password:$("#kp").value};
 if(r=="enseignant"){b.class_id=$("#kc").value||null;b.matiere_id=$("#km").value||null}else if(r=="parent"||r=="eleve")b.student_id=$("#ks").value||null;
